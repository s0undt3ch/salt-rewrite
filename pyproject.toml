[tool.poetry]
name = "rewriter"
version = "2.5.2"
description = "A set of Bowler code to rewrite python code"
authors = ["Pedro Algarvio <pedro@algarvio.me>"]
license = "Apache-2.0"
packages = [
  {include = "rewriter", from = "src" }
]

[tool.poetry.scripts]
"rewriter" = "rewriter.__main__:rewrite"

[tool.poetry.dependencies]
python = ">=3.11,<4"
bowler = ">= 0.9.0"
fissix = {version = "^21.6", allow-prereleases = false}

[tool.poetry.group.dev.dependencies]
pytest = ">= 5.3.4"
pre-commit = "^4.0.0"
coverage = "^7.0.0"

[tool.poetry.plugins."fixers"]
fix_asserts = "rewriter.testsuite.fix_asserts"
fix_destructive_test_decorator = "rewriter.testsuite.fix_destructive_test_decorator"
fix_expensive_test_decorator = "rewriter.testsuite.fix_expensive_test_decorator"
fix_requires_network_decorator = "rewriter.testsuite.fix_requires_network_decorator"
fix_requires_salt_modules_decorator = "rewriter.testsuite.fix_requires_salt_modules_decorator"
fix_requires_salt_states_decorator = "rewriter.testsuite.fix_requires_salt_states_decorator"
fix_skip_if_binaries_missing_decorator = "rewriter.testsuite.fix_skip_if_binaries_missing_decorator"
fix_skip_if_not_root_decorator = "rewriter.testsuite.fix_skip_if_not_root_decorator"
fix_slow_test_decorator = "rewriter.testsuite.fix_slow_test_decorator"
fix_tornado_imports = "rewriter.imports.fix_tornado_imports"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.ruff]
line-length = 120
show-fixes = true
target-version = "py311"
respect-gitignore = true
src = [
  "src",
  "tests",
  "tools",
  "examples",
]
extend-exclude = [
  ".nox/**",
  "examples/pipelines/**",
]
extend-include = [
  "setup.py",
  "noxfile.py",
  "src/**/*.pyi",
]
builtins = [
  "__opts__",
  "__salt__",
#  "__context__",
#  "__grains__",
#  "__pillar__",
  "__salt_system_encoding__",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # D* pydocstyle
  "ANN",     # Don't complain about annotations
  "ARG001",  # Unused function argument
  "COM",     # flake8-commas - Black takes care of this
  "D103",    # Missing docstring in public function
  "D200",    # Reformat to one line
  "D212",    # Remove whitespace after opening quotes
  "ERA",     # eradicate
  "FBT002",  # Boolean default positional argument in function definition
  "PERF203", # `try`-`except` within a loop incurs performance overhead"
  "PERF401", # Use a list comprehension to create a transformed list
  "PERF402", # Use `list` or `list.copy` to create a copy of a list
  "PLR2004", # Magic value used in comparison, consider replacing `2` with a constant variable"
  "PTH",     # Stop complaining about switching to pathlib
  "RET503",  # Missing explicit `return` at the end of function able to return non-`None` value
  "SIM108",  # Use ternary operator `A = X if Y else Z` instead of `if`-`else`-block
  "SIM110",  # Use `return any( ... etc ...)` instead of `for` loop
  "RUF005",  # Consider iterable unpacking instead of concatenation
  "FIX002",  # Line contains TODO, consider resolving the issue"
  "TD002",   # Missing author in TODO; try: `# TODO(<author_name>): ...` or `# TODO @<author_name>: ...`"
  "TD003",   # Missing issue link on the line following this TODO
  "UP038",   # Use `X | Y` in `isinstance` call instead of `(X, Y)` - SLOWER CODE
]

[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = [
  "D104",   # Missing docstring in public package
  "D107",   # Missing docstring in `__init__`
]
"src/**/*.pyi" = [
  "D100",   # Missing docstring in public module
]
"src/rewriter/__main__.py" = [
  "PLR0913", # Too many arguments in function definition
]
"src/rewriter/utils.py" = [
  "S101",   # Use of `assert` detected
]
"src/rewriter/imports/__init__.py" = [
  "F401",   # XYZ imported but unused; consider removing, adding to `__all__`, or using a redundant alias"
]
"src/rewriter/imports/fix_tornado_imports.py" = [
  "S101",   # Use of `assert` detected
]
"src/rewriter/testsuite/__init__.py" = [
  "F401",   # XYZ imported but unused; consider removing, adding to `__all__`, or using a redundant alias"
]
"src/rewriter/testsuite/fix_asserts.py" = [
  "N802",   # Function name `Assert` should be lowercase
]
"setup.py" = [
  "D",
]
"tools/**/*.py" = [
  "ANN201",   # Missing return type annotation for public function"
  "D104",     # Missing docstring in public package
  "FBT001",   # Boolean positional arg in function definition
  "FBT002",   # Boolean default value in function definition
]
"tests/conftest.py" = [
  "SIM115",   # Use a context manager for opening files
]
"tests/**/*.py" = [
  "ANN",      # Ignore missing type annotations in tests
  "ARG001",   # Unused function argument
  "D100",     # Missing docstring in public module
  "D103",     # Missing docstring in public function
  "D104",     # Missing docstring in public package
  "D107",     # Missing docstring in `__init__`"
  "DTZ003",   # The use of `datetime.datetime.utcnow()` is not allowed, use `datetime.datetime.now(tz=)` instead
  "PLR2004",  # Magic value used in comparison, consider replacing 3 with a constant variable
  "PT001",    # use @pytest.fixture() over @pytest.fixture
  "PT023",    # use @pytest.mark.<blah>() over @pytest.mark.<blah>
  "RET504",   # Unnecessary variable assignment before `return` statement"
  "S101",     # Ignore the use of 'assert ...' in tests
  "S603",     # `subprocess` call: check for execution of untrusted input
  "SIM117",   # Use a single `with` statement with multiple contexts instead of nested `with` statements
  "TCH002",   # Move third-party import into a type-checking block
  "TCH003",   # Move standard library import `pathlib` into a type-checking block
]

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = false
force-single-line = true
known-first-party = ["src"]
forced-separate = ["tests"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.pep8-naming]
ignore-names = [
  "__virtual__",
]
[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pylint]
max-branches = 25

[tool.mypy]
python_version = "3.11"
disable_error_code = "import-untyped"
