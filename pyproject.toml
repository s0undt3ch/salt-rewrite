[tool.poetry]
name = "rewriter"
version = "2.5.2"
description = "A set of Bowler code to rewrite python code"
authors = ["Pedro Algarvio <pedro@algarvio.me>"]
license = "Apache-2.0"
packages = [
  {include = "rewriter", from = "src" }
]

[tool.poetry.scripts]
"rewriter" = "rewriter.__main__:rewrite"

[tool.poetry.dependencies]
python = ">=3.11,<4"
bowler = ">= 0.9.0"
fissix = {version = "^21.6", allow-prereleases = false}

[tool.poetry.dev-dependencies]
pytest = ">= 5.3.4"
pylint = "^2.4.4"
pre-commit = "^2.17.0"
coverage = "^5.0.3"
twine = "^4.0.2"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
